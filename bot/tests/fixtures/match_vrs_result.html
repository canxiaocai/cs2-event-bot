<!doctype html>
<html><body>
  <!-- 系列赛结束后 HLTV 把 VRS 面板换成 "VRS result":左列表头 current→before、
       中列表头 wins→result(=该队本场实际增减)、右列(If team loses)整个消失。 -->
  <div class="team1-gradient"><span class="teamName">Alpha</span></div>
  <div class="team2-gradient"><span class="teamName">Beta</span></div>

  <span class="headline">VRS result</span>
  <div class="vrs-forecast-container standard-box text-ellipsis">
    <div class="vrs-forecast-left text-ellipsis">
      <div class="vrs-forecast-team-rows">
        <div class="vrs-forecast-team-row">
          <div class="vrs-forecast-team-name">Beta</div>
        </div>
        <div class="vrs-forecast-team-row">
          <div class="vrs-forecast-team-name">Alpha</div>
        </div>
      </div>
      <div class="vrs-forecast-left-numbers">
        <div class="vrs-forecast-numbers-wrapper">
          <div class="vrs-forecast-points">2012pt</div>
          <div class="vrs-forecast-ranking-wrapper">
            <div class="vrs-forecast-ranking unchanged">#2</div>
          </div>
        </div>
        <div class="vrs-forecast-header current">before</div>
        <div class="vrs-forecast-numbers-wrapper">
          <div class="vrs-forecast-points">1242pt</div>
          <div class="vrs-forecast-ranking-wrapper">
            <div class="vrs-forecast-ranking unchanged">#48</div>
          </div>
        </div>
      </div>
    </div>
    <div class="vrs-forecast-middle">
      <div class="vrs-forecast-numbers-wrapper">
        <div class="vrs-forecast-points">-31pt</div>
        <div class="vrs-forecast-ranking-wrapper">
          <div class="vrs-forecast-ranking unchanged">#2</div>
        </div>
      </div>
      <div class="vrs-forecast-header win-header">result</div>
      <div class="vrs-forecast-numbers-wrapper">
        <div class="vrs-forecast-points">+41pt</div>
        <div class="vrs-forecast-ranking-wrapper">
          <div class="vrs-forecast-ranking rising">#41</div>
          <span class="vrs-forecast-small-points">+7</span>
        </div>
      </div>
    </div>
  </div>
</body></html>
