[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
  ".venv",
  "data",
  "src/plugins/cs2_results/design",
]

[tool.ruff.lint]
select = [
  "E4", "E7", "E9", # import, statement and syntax errors
  "F",                # Pyflakes
  "I",                # import ordering
  "B",                # likely bugs
  "ASYNC",            # async-specific mistakes
  "RUF",              # Ruff-specific correctness rules
]
ignore = [
  "RUF001", # Chinese punctuation/text is intentional in this Chinese bot.
  "RUF002",
  "RUF003",
  "RUF100", # Existing BLE001 noqa markers document deliberate boundary catches.
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"src/plugins/cs2_results/__init__.py" = ["B008"] # NoneBot dependency injection syntax

[tool.pyright]
include = ["bot.py", "src", "tests"]
exclude = [
  ".venv",
  "data",
  "src/plugins/cs2_results/design",
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
pythonPlatform = "Darwin"
typeCheckingMode = "basic"
useLibraryCodeForTypes = true
reportMissingTypeStubs = false
